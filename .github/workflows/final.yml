name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project Safely
        run: |
          mkdir -p temp_code
          cp -r lib temp_code/ || true
          rm -rf *
          flutter create . --project-name royal_crown --platforms=android
          if [ -d "temp_code/lib" ]; then cp -r temp_code/lib/* lib/; fi
          rm -rf temp_code

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Royal-Crown-APK
          path: build/app/outputs/flutter-apk/app-release.apk
